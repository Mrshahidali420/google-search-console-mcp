name: Release build

# Builds a wheel with this project's own OAuth client baked in (decision
# D1), so an installed user never has to create one in the Cloud Console.
#
# Deliberately not on push: the client secret is only available to this
# workflow, and a build that spends it should be something a human asked
# for. The wheel is uploaded as an artifact rather than published — putting
# it on PyPI is a separate decision that needs its own token.
#
# Requires two repository secrets, Settings → Secrets and variables →
# Actions:
#   GSC_MCP_CLIENT_ID
#   GSC_MCP_CLIENT_SECRET
# Neither is ever echoed. Logs on a public repository are public, and a
# secret printed into a build log is as leaked as one committed. GitHub
# masks registered secrets in logs, but that is a safety net, not a design.

on:
  workflow_dispatch:

jobs:
  build:
    name: Build wheel with embedded client
    runs-on: ubuntu-latest

    # Needed to create the release and the tag that goes with it.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install build

      - name: Inject the OAuth client
        env:
          GSC_MCP_CLIENT_ID: ${{ secrets.GSC_MCP_CLIENT_ID }}
          GSC_MCP_CLIENT_SECRET: ${{ secrets.GSC_MCP_CLIENT_SECRET }}
        # Exits non-zero if either secret is unset, so a misconfigured
        # repository fails here rather than producing a wheel that imports
        # fine and only fails when a user tries to sign in.
        run: python scripts/write_embedded.py

      - name: Build
        run: python -m build --wheel

      # The config line that puts _embedded.py into the wheel
      # (tool.hatch.build.targets.wheel.artifacts) exists to defeat
      # hatchling's default of excluding VCS-ignored files. If it ever
      # stops working, every other step here still passes and the wheel
      # ships without a client. So unpack the built wheel and check.
      - name: Prove the client is actually in the wheel
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          if "gsc_mcp/_embedded.py" not in names:
              sys.exit(f"{wheel} has no gsc_mcp/_embedded.py")
          body = zipfile.ZipFile(wheel).read("gsc_mcp/_embedded.py").decode()
          # Compares against the empty-string fallback rather than printing
          # anything, so this proves the values are populated without
          # revealing them.
          if 'CLIENT_ID = ""' in body or 'CLIENT_SECRET = ""' in body:
              sys.exit(f"{wheel} embeds an empty client")
          print(f"{wheel}: embedded client present and non-empty")
          PY

      - uses: actions/upload-artifact@v5
        with:
          name: wheel
          path: dist/*.whl

      # The artifact above expires in 90 days and is only reachable from the
      # run page. The release is the durable copy, and it is created here
      # rather than by hand because doing it by hand is how the GitHub release
      # and the PyPI version drifted three versions apart the first time.
      #
      # Not marked --prerelease, deliberately. GitHub hides pre-releases from
      # /releases/latest and from the repo sidebar, so the flag makes a release
      # look like no release at all. The gate that stops an accidental install
      # is PEP 440: the `aN` in the version means pip refuses without --pre,
      # and that is true regardless of anything GitHub labels it.
      - name: Create or update the release for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/gsc_mcp/__init__.py').read_text()).group(1))")
          tag="v$version"

          # Pull this version's own section out of CHANGELOG.md. A link to the
          # file is not release notes: anyone reading the release has to leave
          # it, find the right heading, and scroll past every later version.
          python - "$version" > notes-body.md <<'PY'
          import pathlib, re, sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          heads = list(re.finditer(r"^## \[([^\]]+)\].*$", text, re.M))
          for i, h in enumerate(heads):
              if h.group(1) != version:
                  continue
              end = heads[i + 1].start() if i + 1 < len(heads) else len(text)
              sys.stdout.write(text[h.end():end].strip() + "\n")
              break
          else:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          PY

          # A pre-release needs --pre to install from PyPI; a final release does
          # not, and telling people otherwise sends them to the wrong command.
          case "$version" in
            *a*|*b*|*rc*) pre_flag=" --pre" ;;
            *)            pre_flag="" ;;
          esac

          {
            cat notes-body.md
            printf '\n---\n\n'
            printf 'The attached wheel has the OAuth client embedded, so no Cloud Console setup is needed.\n\n'
            printf 'The PyPI build of the same version deliberately omits the client and downloads it at first setup: `pip install%s gsc-indexer-mcp`.\n' "$pre_flag"
          } > notes.md

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists; replacing the wheel and refreshing the notes"
            gh release upload "$tag" dist/*.whl --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" dist/*.whl \
              --title "$tag" --notes-file notes.md --latest
          fi
