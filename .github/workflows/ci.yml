name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -v

      # The two POSIX permission tests are skipif-gated on Windows, so for the
      # whole of this project's history they have never executed anywhere.
      # Running them is not enough — a change to the skipif condition would
      # reopen that hole silently, with the suite still green. This step fails
      # unless both tests actually report as passed.
      - name: Prove the POSIX permission tests executed, not skipped
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m pytest -v --no-header \
            tests/test_gauth_tokens.py::test_token_file_is_owner_readable_only \
            tests/test_gauth_tokens.py::test_no_world_readable_window_during_write \
            | tee permission-tests.txt
          grep -qE '^2 passed|2 passed[ ,]' permission-tests.txt
