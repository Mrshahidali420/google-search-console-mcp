[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gsc-mcp"
# Read from src/gsc_mcp/__init__.py rather than written here, so the wheel's
# version and the version the MCP handshake reports have one source. See
# [tool.hatch.version] at the foot of this file.
dynamic = ["version"]
description = "Google Search Console MCP server: index status, discovery, request indexing, sitemap submission, and search analytics for Claude and other AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Shahid Ali" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "google-search-console",
    "search-console",
    "gsc",
    "seo",
    "indexing",
    "url-inspection",
    "sitemap",
    "search-analytics",
    "claude",
    "ai-agents",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31",
    # <2.0: mcp 2.0.0 removed FastMCP outright, renaming it to MCPServer
    # under mcp.server.mcpserver with a different construction API. Pinned
    # below that break until this server is ported to the new shape.
    "mcp>=1.2,<2.0",
    # >=12: the release that introduced the THREADING (sync) implementation
    # the bridge server is built on. Everything bridge.py touches is present
    # in 12.0 as shipped -- serve(), Server.serve_forever(), Server.shutdown(),
    # Server.socket, and Connection.recv(timeout=...). The bridge deliberately
    # does not depend on Server.shutdown() closing established connections:
    # on 13.0-16.x it only closes the LISTENING socket (verified in review),
    # so the read loop polls with a bounded recv() instead and teardown works
    # the same on every release from 12 up.
    # <18: an upper bound because nothing above 17 has been tried here. 17.0
    # already changed shutdown()'s signature and semantics -- the code
    # survives that one, but a public package should not silently adopt a
    # major it has never been run against.
    "websockets>=12,<18",
    # Sitemaps are remote, third-party XML. defusedxml is the entity-expansion
    # and external-entity defence; there is deliberately no stdlib fallback,
    # because silently downgrading to an unsafe parser is worse than a
    # missing dependency. Pure-Python and stable; no upper bound needed.
    "defusedxml>=0.7",
]

[project.scripts]
gsc-mcp = "gsc_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Mrshahidali420/google-search-console-mcp"
Repository = "https://github.com/Mrshahidali420/google-search-console-mcp"
Issues = "https://github.com/Mrshahidali420/google-search-console-mcp/issues"

[project.optional-dependencies]
# pytest 9.1 is the floor, not 8.x: the runlog tests rely on caplog attaching
# to a non-propagating logger, which this package's runlog deliberately sets.
dev = ["pytest>=9.1", "pytest-cov>=5.0"]

[tool.hatch.version]
path = "src/gsc_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
# The vendored browser extension (src/gsc_mcp/extension/) ships as package
# data. Hatchling carries non-Python files inside a listed package by default,
# so no force-include entry is needed: a wheel built from this config was
# unpacked and confirmed to contain all ten extension files under
# gsc_mcp/extension/. Re-check that if the build backend is ever changed --
# a package-data glob that silently matches nothing fails at install time,
# not in CI.
packages = ["src/gsc_core", "src/gsc_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
