[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gsc-mcp"
version = "0.1.0"
description = "Google Search Console MCP server: index status, discovery, submission, and analytics for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
# pytest 9.1 is the floor, not 8.x: the runlog tests rely on caplog attaching
# to a non-propagating logger, which this package's runlog deliberately sets.
dev = ["pytest>=9.1", "pytest-cov>=5.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/gsc_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
